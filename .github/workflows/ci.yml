name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: shellcheck
        run: shellcheck ir-isp-blocker.sh tests/*.sh tests/fake-bin/nft
      - name: bash syntax
        run: bash -n ir-isp-blocker.sh
      - name: generator unit tests + published list validation
        run: python -m unittest discover -s tests -v
      - name: installer tests (dry-run + fake nft)
        run: bash tests/run_tests.sh

  integration:
    # Applies real rules with nftables, ipset and plain iptables - inside a throwaway
    # network namespace so the runner's own firewall is never touched.
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - name: install firewall tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables ipset iptables
      - name: real apply in a network namespace
        run: sudo unshare --net bash tests/integration_netns.sh
