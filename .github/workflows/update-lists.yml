name: Update IP lists

on:
  schedule:
    - cron: "17 3 * * 1"   # weekly, Monday 03:17 UTC
  workflow_dispatch:
    inputs:
      open_pr:
        description: "Open a pull request instead of committing to main"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-lists
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: keep previous lists for the shrink guard
        run: cp -r lists "$RUNNER_TEMP/prev-lists"

      - name: regenerate from RIPEstat + RIPE delegated stats
        # fails (and commits nothing) if any ASN holder no longer matches data/isps.json
        run: python tools/ipgen.py generate

      - name: sanity checks (CIDR syntax, aggregation, checksums, >50% shrink, legacy files)
        run: python tools/ipgen.py validate --previous "$RUNNER_TEMP/prev-lists"

      - name: unit tests
        run: python -m unittest discover -s tests

      - name: commit or open PR
        env:
          GH_TOKEN: ${{ github.token }}
          OPEN_PR: ${{ inputs.open_pr }}
        run: |
          if git diff --quiet -- lists '*-ips.ipv4'; then
            echo "lists unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          msg="lists: automatic update $(date -u +%F)"
          if [ "$OPEN_PR" = "true" ]; then
            branch="lists-update-$(date -u +%Y%m%d%H%M)"
            git switch -c "$branch"
            git add lists ./*-ips.ipv4
            git commit -m "$msg"
            git push origin "$branch"
            gh pr create --title "$msg" --body "Automated weekly regeneration (validated: syntax, aggregation, checksums, shrink guard)."
          else
            git add lists ./*-ips.ipv4
            git commit -m "$msg"
            git push
          fi
